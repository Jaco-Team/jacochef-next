name: jacochef-next-production

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NODE_VERSION: "22"
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}"
        NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY: "${NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY:-}"
        MUI_STYLE_ENGINE: "${MUI_STYLE_ENGINE:-sc}"
    image: "jacochef-next:${IMAGE_TAG:?IMAGE_TAG is required}"
    environment:
      BACKEND_HTTP: "${BACKEND_HTTP:-http://host.docker.internal:8080}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_HTTP_BIND:-127.0.0.1}:${FRONTEND_HTTP_PORT:-3000}:3000"
    restart: unless-stopped
