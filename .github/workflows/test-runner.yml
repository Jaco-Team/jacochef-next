name: Build and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jacosoft-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://apichef2.jacochef.ru/api/
            NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY=${{ vars.NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY }}
            MUI_STYLE_ENGINE=sc
          tags: |
            ghcr.io/jaco-team/jacochef-next:${{ github.sha }}
            ghcr.io/jaco-team/jacochef-next:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Configure deployment SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ANSIBLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable frontend release through Ansible
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANSIBLE_HOST: ${{ secrets.ANSIBLE_HOST }}
          ANSIBLE_USER: ${{ secrets.ANSIBLE_USER }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$ANSIBLE_USER@$ANSIBLE_HOST" \
            "/opt/jaco/ansible/bin/deploy-jacochef-component jacosoft $GITHUB_SHA $GITHUB_ACTOR"
