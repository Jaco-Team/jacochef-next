name: jacochef-next-dev

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        NODE_VERSION: "22"
    image: jacochef-next:development
    init: true
    environment:
      NEXT_PUBLIC_API_URL: "${DOCKER_NEXT_PUBLIC_API_URL:-http://localhost:8080/api}"
      BACKEND_HTTP: "${BACKEND_HTTP:-http://host.docker.internal:8080}"
      WATCHPACK_POLLING: "${WATCHPACK_POLLING:-true}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_HTTP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules_data:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  node_modules_data:
